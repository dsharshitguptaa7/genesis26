<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis'26 | Digital Entry Pass</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Pass Stylesheet -->
    <link rel="stylesheet" href="css/pass.css">
</head>

<body>

    <main class="pass-page">

        <div class="pass-card" id="passCard">

            <!-- Card Header -->
            <header class="pass-header">
                <p class="event-label">FRESHERS' PARTY</p>
                <h1>GENESIS'26</h1>
                <p class="event-subtitle">OFFICIAL ENTRY PASS</p>
            </header>

            <!-- Decorative Gold Divider -->
            <div class="gold-line"></div>

            <!-- Pass Content Container -->
            <div class="pass-body">

                <!-- Student Information -->
                <div class="student-details">
                    <div class="detail-row">
                        <span class="detail-label">NAME</span>
                        <strong class="detail-value" id="studentName">Loading...</strong>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">ENROLLMENT ID</span>
                        <strong class="detail-value" id="studentEnrollment">Loading...</strong>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">COURSE</span>
                        <strong class="detail-value" id="studentCourse">Loading...</strong>
                    </div>
                </div>

                <!-- QR Section -->
                <div class="qr-section">
                    <div class="qr-wrapper">
                        <div id="entryQR" aria-label="Dynamic Entry QR Code"></div>
                    </div>
                    <p class="scan-text">Scan for event entry</p>
                </div>

                <!-- Pass ID Badge -->
                <div class="pass-id-container">
                    <span class="pass-id-label">PASS ID</span>
                    <strong class="pass-id-value" id="studentPassId">Loading...</strong>
                </div>

                <!-- Pass Validity Badge -->
                <div class="valid-status">
                    <span class="status-icon">✓</span>
                    <span class="status-text">VALID ENTRY PASS</span>
                </div>

                <!-- Pass Actions (Hidden on Print) -->
                <div class="pass-actions">
                    <button type="button" id="downloadBtn" class="btn-download">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download Pass
                    </button>
                    <a href="index.html" class="btn-back">← Back to Portal</a>
                </div>

            </div>

        </div>

    </main>

    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Pass Logic Script -->
    <script src="js/pass.js"></script>

</body>

</html>
